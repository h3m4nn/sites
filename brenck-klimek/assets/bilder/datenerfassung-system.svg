<svg xmlns="http://www.w3.org/2000/svg" class="dg-diagramm" width="960" height="420" role="img" aria-labelledby="dg-titel" aria-describedby="dg-beschreibung">
  <title id="dg-titel">Aufbau des Datenerfassungssystems</title>
  <desc id="dg-beschreibung">Die Datenerfassungsmodule (DEM) bilden die Schnittstellen zu den einzelnen Fertigungszellen, unter anderem über RS232, digitale (24 V) und analoge Ein- und Ausgänge, Bildverarbeitungssysteme und Prüfachsen. Über einen Feldbus (Profibus) holt der Datenerfassungsrechner unter Linux die Daten zyklisch ab. Er dient der Datenerfassung, Visualisierung und Auswertung und ist als Server in das Firmennetz (Windows und Unix) eingebunden.</desc>
  <style>
    /* Zwei Fassungen: quer (960 x 420) ab 48rem Fensterbreite, darunter hoch (360 x 600), damit die Schrift
       auf dem Telefon lesbar bleibt. Farben nur über --diagramm-linie, -flaeche, -akzent, -text. */
    :root svg.dg-diagramm { display: block; width: 100%; height: auto; aspect-ratio: 960 / 420; }
    svg.dg-diagramm > svg { display: inline; width: 100%; height: 100%; max-width: none; margin: 0; }
    svg.dg-diagramm > svg.dg-hoch { display: none; }
    @media (max-width: 48rem) {
      :root svg.dg-diagramm { aspect-ratio: 360 / 600; max-width: 26rem; margin-inline: auto; }
      svg.dg-diagramm > svg.dg-quer { display: none; }
      svg.dg-diagramm > svg.dg-hoch { display: inline; }
    }
    .dg-grund { fill: var(--diagramm-flaeche, #fff); }
    .dg-kasten { fill: var(--diagramm-flaeche, #fff); stroke: var(--diagramm-linie, #1d232a); stroke-width: 2; }
    .dg-modul { fill: var(--diagramm-flaeche, #fff); stroke: var(--diagramm-akzent, #FF9818); stroke-width: 3; }
    .dg-leitung { fill: none; stroke: var(--diagramm-linie, #1d232a); stroke-width: 2; }
    .dg-buendel { fill: none; stroke: var(--diagramm-linie, #1d232a); stroke-width: 1.5; }
    .dg-bus { fill: none; stroke: var(--diagramm-akzent, #FF9818); stroke-width: 6; stroke-linecap: round; stroke-linejoin: round; }
    .dg-stich { fill: none; stroke: var(--diagramm-akzent, #FF9818); stroke-width: 3; }
    .dg-zone { fill: none; stroke: var(--diagramm-linie, #1d232a); stroke-width: 1.5; stroke-dasharray: 6 5; }
    .dg-punkt { fill: var(--diagramm-akzent, #FF9818); }
    .dg-knoten { fill: var(--diagramm-linie, #1d232a); }
    .dg-schrift { fill: var(--diagramm-text, #1d232a); font-family: "IBM Plex Sans", sans-serif; font-size: 15px; }
    .dg-fett { font-size: 16px; font-weight: 600; }
    .dg-gross { font-size: 18px; font-weight: 600; }
    .dg-klein { font-size: 14px; }
    .dg-mitte { text-anchor: middle; }
    .dg-rechts { text-anchor: end; }
  </style>

  <!-- Querformat -->
  <svg class="dg-quer" viewBox="0 0 960 420" width="100%" height="100%" aria-hidden="true">
    <rect class="dg-grund" width="960" height="420"/>
    <!-- Fertigungszellen -->
    <rect class="dg-kasten" x="16" y="28" width="152" height="160" rx="3"/>
    <rect class="dg-kasten" x="16" y="226" width="152" height="60" rx="3"/>
    <rect class="dg-kasten" x="16" y="336" width="152" height="60" rx="3"/>
    <text class="dg-schrift dg-fett dg-mitte" x="92" y="113.5">Fertigungszelle 1</text>
    <text class="dg-schrift dg-fett dg-mitte" x="92" y="261.5">Fertigungszelle 2</text>
    <text class="dg-schrift dg-fett dg-mitte" x="92" y="371.5">Fertigungszelle n</text>
    <circle class="dg-knoten" cx="92" cy="303" r="2.5"/>
    <circle class="dg-knoten" cx="92" cy="311" r="2.5"/>
    <circle class="dg-knoten" cx="92" cy="319" r="2.5"/>
    <!-- Schnittstellen Zelle 1 / DEM 1, an den übrigen Zellen gebündelt -->
    <path class="dg-leitung" d="M168 60H356M168 88H356M168 116H356M168 144H356M168 172H356"/>
    <text class="dg-schrift" x="180" y="53">RS232</text>
    <text class="dg-schrift" x="180" y="81">24 V digital</text>
    <text class="dg-schrift" x="180" y="109">analog</text>
    <text class="dg-schrift" x="180" y="137">Bildverarbeitung</text>
    <text class="dg-schrift" x="180" y="165">Prüfachse</text>
    <circle class="dg-punkt" cx="356" cy="60" r="4"/>
    <circle class="dg-punkt" cx="356" cy="88" r="4"/>
    <circle class="dg-punkt" cx="356" cy="116" r="4"/>
    <circle class="dg-punkt" cx="356" cy="144" r="4"/>
    <circle class="dg-punkt" cx="356" cy="172" r="4"/>
    <path class="dg-buendel" d="M168 244H356M168 250H356M168 256H356M168 262H356M168 268H356M168 354H356M168 360H356M168 366H356M168 372H356M168 378H356"/>
    <!-- Datenerfassungsmodule -->
    <rect class="dg-modul" x="356" y="28" width="168" height="160" rx="3"/>
    <rect class="dg-modul" x="356" y="226" width="168" height="60" rx="3"/>
    <rect class="dg-modul" x="356" y="336" width="168" height="60" rx="3"/>
    <text class="dg-schrift dg-gross dg-mitte" x="440" y="104">DEM 1</text>
    <text class="dg-schrift dg-klein dg-mitte" x="440" y="128">Datenerfassungsmodul</text>
    <text class="dg-schrift dg-gross dg-mitte" x="440" y="262.5">DEM 2</text>
    <text class="dg-schrift dg-gross dg-mitte" x="440" y="372.5">DEM n</text>
    <circle class="dg-knoten" cx="440" cy="303" r="2.5"/>
    <circle class="dg-knoten" cx="440" cy="311" r="2.5"/>
    <circle class="dg-knoten" cx="440" cy="319" r="2.5"/>
    <!-- Feldbus (Profibus) -->
    <path class="dg-stich" d="M524 108H556M524 256H556M524 366H556"/>
    <path class="dg-bus" d="M556 108V366M556 150H700"/>
    <circle class="dg-punkt" cx="556" cy="108" r="6"/>
    <circle class="dg-punkt" cx="556" cy="150" r="6"/>
    <circle class="dg-punkt" cx="556" cy="256" r="6"/>
    <circle class="dg-punkt" cx="556" cy="366" r="6"/>
    <text class="dg-schrift" x="572" y="138">Feldbus (Profibus)</text>
    <!-- Datenerfassungsrechner: dient selbst der Datenerfassung, Visualisierung und Auswertung (alte Seite) -->
    <rect class="dg-kasten" x="700" y="98" width="244" height="112" rx="3"/>
    <text class="dg-schrift dg-fett dg-mitte" x="822" y="134">Datenerfassungsrechner</text>
    <text class="dg-schrift dg-mitte" x="822" y="158">Linux · Server</text>
    <text class="dg-schrift dg-klein dg-mitte" x="822" y="186">Visualisierung · Auswertung</text>
    <!-- Firmennetz: der Rechner ist als Server eingebunden (Windows und Unix) -->
    <rect class="dg-zone" x="696" y="250" width="252" height="154" rx="6"/>
    <path class="dg-leitung" d="M822 210V290M762 290H884M762 290V312M884 290V312"/>
    <circle class="dg-knoten" cx="822" cy="290" r="4"/>
    <rect class="dg-kasten" x="706" y="312" width="112" height="48" rx="3"/>
    <rect class="dg-kasten" x="828" y="312" width="112" height="48" rx="3"/>
    <text class="dg-schrift dg-mitte" x="762" y="341">Windows</text>
    <text class="dg-schrift dg-mitte" x="884" y="341">Unix</text>
    <text class="dg-schrift dg-mitte" x="822" y="388">Firmennetz</text>
  </svg>

  <!-- Hochformat (schmale Fenster) -->
  <svg class="dg-hoch" viewBox="0 0 360 600" width="100%" height="100%" aria-hidden="true">
    <rect class="dg-grund" width="360" height="600"/>
    <!-- Fertigungszellen -->
    <rect class="dg-kasten" x="8" y="12" width="128" height="140" rx="3"/>
    <rect class="dg-kasten" x="8" y="172" width="128" height="52" rx="3"/>
    <rect class="dg-kasten" x="8" y="266" width="128" height="52" rx="3"/>
    <text class="dg-schrift dg-fett dg-klein dg-mitte" x="72" y="87">Fertigungszelle 1</text>
    <text class="dg-schrift dg-fett dg-klein dg-mitte" x="72" y="203">Fertigungszelle 2</text>
    <text class="dg-schrift dg-fett dg-klein dg-mitte" x="72" y="297">Fertigungszelle n</text>
    <circle class="dg-knoten" cx="72" cy="238" r="2.5"/>
    <circle class="dg-knoten" cx="72" cy="245" r="2.5"/>
    <circle class="dg-knoten" cx="72" cy="252" r="2.5"/>
    <!-- Schnittstellen -->
    <path class="dg-leitung" d="M136 26H258M136 54H258M136 82H258M136 110H258M136 138H258"/>
    <text class="dg-schrift dg-klein" x="142" y="20">RS232</text>
    <text class="dg-schrift dg-klein" x="142" y="48">24 V digital</text>
    <text class="dg-schrift dg-klein" x="142" y="76">analog</text>
    <text class="dg-schrift dg-klein" x="142" y="104">Bildverarbeitung</text>
    <text class="dg-schrift dg-klein" x="142" y="132">Prüfachse</text>
    <circle class="dg-punkt" cx="258" cy="26" r="3.5"/>
    <circle class="dg-punkt" cx="258" cy="54" r="3.5"/>
    <circle class="dg-punkt" cx="258" cy="82" r="3.5"/>
    <circle class="dg-punkt" cx="258" cy="110" r="3.5"/>
    <circle class="dg-punkt" cx="258" cy="138" r="3.5"/>
    <path class="dg-buendel" d="M136 186H258M136 192H258M136 198H258M136 204H258M136 210H258M136 280H258M136 286H258M136 292H258M136 298H258M136 304H258"/>
    <!-- Datenerfassungsmodule -->
    <rect class="dg-modul" x="258" y="12" width="70" height="140" rx="3"/>
    <rect class="dg-modul" x="258" y="172" width="70" height="52" rx="3"/>
    <rect class="dg-modul" x="258" y="266" width="70" height="52" rx="3"/>
    <text class="dg-schrift dg-gross dg-mitte" x="293" y="88">DEM 1</text>
    <text class="dg-schrift dg-gross dg-mitte" x="293" y="204">DEM 2</text>
    <text class="dg-schrift dg-gross dg-mitte" x="293" y="298">DEM n</text>
    <circle class="dg-knoten" cx="293" cy="238" r="2.5"/>
    <circle class="dg-knoten" cx="293" cy="245" r="2.5"/>
    <circle class="dg-knoten" cx="293" cy="252" r="2.5"/>
    <!-- Feldbus (Profibus) -->
    <path class="dg-stich" d="M328 82H344M328 198H344M328 292H344"/>
    <path class="dg-bus" d="M344 82V406H300"/>
    <circle class="dg-punkt" cx="344" cy="82" r="5"/>
    <circle class="dg-punkt" cx="344" cy="198" r="5"/>
    <circle class="dg-punkt" cx="344" cy="292" r="5"/>
    <text class="dg-schrift dg-rechts" x="334" y="352">Feldbus (Profibus)</text>
    <!-- Datenerfassungsrechner: dient selbst der Datenerfassung, Visualisierung und Auswertung (alte Seite) -->
    <rect class="dg-kasten" x="60" y="364" width="240" height="88" rx="3"/>
    <text class="dg-schrift dg-fett dg-mitte" x="180" y="390">Datenerfassungsrechner</text>
    <text class="dg-schrift dg-mitte" x="180" y="413">Linux · Server</text>
    <text class="dg-schrift dg-klein dg-mitte" x="180" y="437">Visualisierung · Auswertung</text>
    <!-- Firmennetz: der Rechner ist als Server eingebunden (Windows und Unix) -->
    <rect class="dg-zone" x="24" y="472" width="312" height="116" rx="6"/>
    <path class="dg-leitung" d="M180 452V492M105 492H255M105 492V506M255 492V506"/>
    <circle class="dg-knoten" cx="180" cy="492" r="4"/>
    <rect class="dg-kasten" x="40" y="506" width="130" height="44" rx="3"/>
    <rect class="dg-kasten" x="190" y="506" width="130" height="44" rx="3"/>
    <text class="dg-schrift dg-mitte" x="105" y="533">Windows</text>
    <text class="dg-schrift dg-mitte" x="255" y="533">Unix</text>
    <text class="dg-schrift dg-mitte" x="180" y="574">Firmennetz</text>
  </svg>
</svg>
