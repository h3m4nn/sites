<svg xmlns="http://www.w3.org/2000/svg" class="gi-diagramm" width="960" height="520" role="img" aria-labelledby="gi-titel" aria-describedby="gi-beschreibung">
  <title id="gi-titel">Gebäudeinstallation im Überblick</title>
  <desc id="gi-beschreibung">Gebäudeumriss mit Photovoltaikmodulen auf dem Dach. Vom Netz führt die Leitung über den Hausanschluss und den Zählerplatz zur Hauptverteilung. In die Hauptverteilung speist die Photovoltaik über den Wechselrichter ein, an dem ein Speicher angeschlossen ist. Die Hauptverteilung versorgt die Wallbox und die Unterverteilungen 1 bis n. Von der Unterverteilung gehen die Stromkreise für Steckdosen, Kraft und Licht ab, der Lichtstromkreis führt zur Beleuchtung innen und außen. Eine KNX-Linie der Gebäudeautomation führt von der Unterverteilung zu Jalousien und Beleuchtung. Zu Daten und Kommunikation gehören Netzwerk, Telefon, TV/SAT und Türsprechanlage.</desc>
  <style>
    /* Zwei Fassungen wie datenerfassung-system.svg: quer (960 x 520) ab 48rem Fensterbreite, darunter hoch (360 x 712).
       Farben nur über --diagramm-linie, -flaeche, -akzent, -text. Orange (dick) = Energiefluss, gestrichelt = KNX-Linie. */
    :root svg.gi-diagramm { display: block; width: 100%; height: auto; aspect-ratio: 960 / 520; }
    svg.gi-diagramm > svg { display: inline; width: 100%; height: 100%; max-width: none; margin: 0; }
    svg.gi-diagramm > svg.gi-hoch { display: none; }
    @media (max-width: 48rem) {
      :root svg.gi-diagramm { aspect-ratio: 360 / 712; max-width: 26rem; margin-inline: auto; }
      svg.gi-diagramm > svg.gi-quer { display: none; }
      svg.gi-diagramm > svg.gi-hoch { display: inline; }
    }
    .gi-grund { fill: var(--diagramm-flaeche, #fff); }
    .gi-haus { fill: none; stroke: var(--diagramm-linie, #1d232a); stroke-width: 2; stroke-linejoin: round; }
    .gi-dach { fill: none; stroke: var(--diagramm-linie, #1d232a); stroke-width: 3; stroke-linecap: round; stroke-linejoin: round; }
    .gi-kasten { fill: var(--diagramm-flaeche, #fff); stroke: var(--diagramm-linie, #1d232a); stroke-width: 2; }
    .gi-modul { fill: var(--diagramm-flaeche, #fff); stroke: var(--diagramm-akzent, #FF9818); stroke-width: 3; }
    .gi-pv { fill: var(--diagramm-flaeche, #fff); stroke: var(--diagramm-akzent, #FF9818); stroke-width: 2.5; stroke-linejoin: round; }
    .gi-zelle { fill: none; stroke: var(--diagramm-akzent, #FF9818); stroke-width: 1.25; }
    .gi-leitung { fill: none; stroke: var(--diagramm-linie, #1d232a); stroke-width: 2; }
    .gi-energie { fill: none; stroke: var(--diagramm-akzent, #FF9818); stroke-width: 6; stroke-linecap: round; stroke-linejoin: round; }
    .gi-stich { fill: none; stroke: var(--diagramm-akzent, #FF9818); stroke-width: 3; }
    .gi-knx { fill: none; stroke: var(--diagramm-linie, #1d232a); stroke-width: 3; stroke-dasharray: 9 5; }
    .gi-zone { fill: none; stroke: var(--diagramm-linie, #1d232a); stroke-width: 1.5; stroke-dasharray: 6 5; }
    .gi-punkt { fill: var(--diagramm-akzent, #FF9818); }
    .gi-knoten { fill: var(--diagramm-linie, #1d232a); }
    .gi-schrift { fill: var(--diagramm-text, #1d232a); font-family: "IBM Plex Sans", sans-serif; font-size: 15px; }
    .gi-fett { font-size: 16px; font-weight: 600; }
    .gi-klein { font-size: 14px; }
    .gi-mitte { text-anchor: middle; }
    .gi-rechts { text-anchor: end; }
  </style>

  <!-- Querformat -->
  <svg class="gi-quer" viewBox="0 0 960 520" width="100%" height="100%" aria-hidden="true">
    <rect class="gi-grund" width="960" height="520"/>
    <!-- Gebäude: Satteldach, Wände, Boden -->
    <path class="gi-haus" d="M48 139.5V504H912V139.5"/>
    <path class="gi-dach" d="M24 146 480 22 936 146"/>
    <!-- Photovoltaik: drei Module auf der linken Dachfläche, Leitung zum Wechselrichter -->
    <path class="gi-energie" d="M316 58V168"/>
    <g transform="translate(316 66.6) rotate(-15.21)">
      <rect class="gi-pv" x="-102" y="-24" width="64" height="18"/>
      <rect class="gi-pv" x="-32" y="-24" width="64" height="18"/>
      <rect class="gi-pv" x="38" y="-24" width="64" height="18"/>
      <path class="gi-zelle" d="M-102 -15H-38M-86 -24V-6M-70 -24V-6M-54 -24V-6M-32 -15H32M-16 -24V-6M0 -24V-6M16 -24V-6M38 -15H102M54 -24V-6M70 -24V-6M86 -24V-6"/>
    </g>
    <text class="gi-schrift" x="330" y="142">Photovoltaik</text>
    <!-- Erzeugung und Speicher -->
    <path class="gi-energie" d="M208 192H240M316 216V256"/>
    <rect class="gi-kasten" x="72" y="168" width="136" height="48" rx="3"/>
    <rect class="gi-kasten" x="240" y="168" width="152" height="48" rx="3"/>
    <text class="gi-schrift gi-fett gi-mitte" x="140" y="197.5">Speicher</text>
    <text class="gi-schrift gi-fett gi-mitte" x="316" y="197.5">Wechselrichter</text>
    <!-- Netz, Hausanschluss, Zählerplatz, Hauptverteilung -->
    <path class="gi-energie" d="M0 380H72M140 356V312M208 284H240"/>
    <text class="gi-schrift gi-klein" x="8" y="371">Netz</text>
    <rect class="gi-kasten" x="72" y="356" width="136" height="48" rx="3"/>
    <rect class="gi-kasten" x="72" y="256" width="136" height="56" rx="3"/>
    <rect class="gi-modul" x="240" y="256" width="152" height="56" rx="3"/>
    <text class="gi-schrift gi-fett gi-mitte" x="140" y="385.5">Hausanschluss</text>
    <text class="gi-schrift gi-fett gi-mitte" x="140" y="289.5">Zählerplatz</text>
    <text class="gi-schrift gi-fett gi-mitte" x="316" y="289.5">Hauptverteilung</text>
    <!-- Wallbox an der Hauptverteilung -->
    <path class="gi-leitung" d="M316 312V356"/>
    <rect class="gi-kasten" x="240" y="356" width="152" height="48" rx="3"/>
    <text class="gi-schrift gi-fett gi-mitte" x="316" y="385.5">Wallbox</text>
    <!-- Hauptverteilung zu den Unterverteilungen -->
    <path class="gi-energie" d="M392 284H420V380"/>
    <path class="gi-stich" d="M420 284H448M420 380H448"/>
    <circle class="gi-punkt" cx="420" cy="284" r="6"/>
    <circle class="gi-punkt" cx="420" cy="380" r="6"/>
    <rect class="gi-modul" x="448" y="244" width="152" height="80" rx="3"/>
    <rect class="gi-modul" x="448" y="356" width="152" height="48" rx="3"/>
    <text class="gi-schrift gi-fett gi-mitte" x="524" y="289.5">Unterverteilung 1</text>
    <text class="gi-schrift gi-fett gi-mitte" x="524" y="385.5">Unterverteilung n</text>
    <circle class="gi-knoten" cx="524" cy="332" r="2.5"/>
    <circle class="gi-knoten" cx="524" cy="340" r="2.5"/>
    <circle class="gi-knoten" cx="524" cy="348" r="2.5"/>
    <!-- Stromkreise: Steckdosen und Kraft enden als Abgänge, Licht führt zur Beleuchtung -->
    <path class="gi-leitung" d="M600 258H710M600 284H710M600 310H811V352"/>
    <text class="gi-schrift" x="612" y="251">Steckdosen</text>
    <text class="gi-schrift" x="612" y="277">Kraft</text>
    <text class="gi-schrift" x="612" y="303">Licht</text>
    <circle class="gi-punkt" cx="710" cy="258" r="4"/>
    <circle class="gi-punkt" cx="710" cy="284" r="4"/>
    <circle class="gi-punkt" cx="811" cy="352" r="4"/>
    <rect class="gi-kasten" x="744" y="352" width="134" height="56" rx="3"/>
    <text class="gi-schrift gi-fett gi-mitte" x="811" y="376">Beleuchtung</text>
    <text class="gi-schrift gi-mitte" x="811" y="396">innen · außen</text>
    <!-- Gebäudeautomation: KNX-Linie zu Jalousien und Beleuchtung -->
    <path class="gi-knx" d="M524 244V230H894M878 190H894V380H878"/>
    <circle class="gi-knoten" cx="894" cy="230" r="4"/>
    <text class="gi-schrift" x="536" y="222">Gebäudeautomation (KNX)</text>
    <rect class="gi-kasten" x="744" y="168" width="134" height="44" rx="3"/>
    <text class="gi-schrift gi-fett gi-mitte" x="811" y="195.5">Jalousien</text>
    <!-- Daten und Kommunikation -->
    <rect class="gi-zone" x="72" y="428" width="812" height="60" rx="6"/>
    <text class="gi-schrift gi-fett" x="92" y="463.5">Daten und Kommunikation</text>
    <rect class="gi-kasten" x="320" y="438" width="128" height="40" rx="3"/>
    <rect class="gi-kasten" x="460" y="438" width="128" height="40" rx="3"/>
    <rect class="gi-kasten" x="600" y="438" width="128" height="40" rx="3"/>
    <rect class="gi-kasten" x="740" y="438" width="128" height="40" rx="3"/>
    <text class="gi-schrift gi-mitte" x="384" y="463">Netzwerk</text>
    <text class="gi-schrift gi-mitte" x="524" y="463">Telefon</text>
    <text class="gi-schrift gi-mitte" x="664" y="463">TV/SAT</text>
    <text class="gi-schrift gi-mitte" x="804" y="463">Türsprechanlage</text>
  </svg>

  <!-- Hochformat (schmale Fenster) -->
  <svg class="gi-hoch" viewBox="0 0 360 712" width="100%" height="100%" aria-hidden="true">
    <rect class="gi-grund" width="360" height="712"/>
    <!-- Gebäude -->
    <path class="gi-haus" d="M10 92.2V696H318V92.2"/>
    <path class="gi-dach" d="M2 96 164 20 326 96"/>
    <!-- Photovoltaik -->
    <path class="gi-energie" d="M100 44V116"/>
    <g transform="translate(100 50) rotate(-25.13)">
      <rect class="gi-pv" x="-56" y="-18" width="34" height="14"/>
      <rect class="gi-pv" x="-17" y="-18" width="34" height="14"/>
      <rect class="gi-pv" x="22" y="-18" width="34" height="14"/>
      <path class="gi-zelle" d="M-56 -11H-22M-44.7 -18V-4M-33.3 -18V-4M-17 -11H17M-5.7 -18V-4M5.7 -18V-4M22 -11H56M33.3 -18V-4M44.7 -18V-4"/>
    </g>
    <text class="gi-schrift gi-klein" x="112" y="102">Photovoltaik</text>
    <!-- Erzeugung und Speicher -->
    <path class="gi-energie" d="M184 134H164M100 152V180"/>
    <rect class="gi-kasten" x="36" y="116" width="128" height="36" rx="3"/>
    <rect class="gi-kasten" x="184" y="116" width="120" height="36" rx="3"/>
    <text class="gi-schrift gi-fett gi-klein gi-mitte" x="100" y="139">Wechselrichter</text>
    <text class="gi-schrift gi-fett gi-klein gi-mitte" x="244" y="139">Speicher</text>
    <!-- Netz, Hausanschluss, Zählerplatz, Hauptverteilung -->
    <path class="gi-energie" d="M360 266H304M244 248V220M184 200H164"/>
    <text class="gi-schrift gi-klein gi-rechts" x="356" y="257">Netz</text>
    <rect class="gi-modul" x="36" y="180" width="128" height="40" rx="3"/>
    <rect class="gi-kasten" x="184" y="180" width="120" height="40" rx="3"/>
    <rect class="gi-kasten" x="184" y="248" width="120" height="36" rx="3"/>
    <text class="gi-schrift gi-fett gi-klein gi-mitte" x="100" y="205">Hauptverteilung</text>
    <text class="gi-schrift gi-fett gi-klein gi-mitte" x="244" y="205">Zählerplatz</text>
    <text class="gi-schrift gi-fett gi-klein gi-mitte" x="244" y="271">Hausanschluss</text>
    <!-- Wallbox -->
    <path class="gi-leitung" d="M100 220V248"/>
    <rect class="gi-kasten" x="36" y="248" width="128" height="36" rx="3"/>
    <text class="gi-schrift gi-fett gi-klein gi-mitte" x="100" y="271">Wallbox</text>
    <!-- Hauptverteilung zu den Unterverteilungen -->
    <path class="gi-energie" d="M36 200H22V432"/>
    <path class="gi-stich" d="M22 348H36M22 432H36"/>
    <circle class="gi-punkt" cx="22" cy="348" r="5"/>
    <circle class="gi-punkt" cx="22" cy="432" r="5"/>
    <rect class="gi-modul" x="36" y="312" width="128" height="72" rx="3"/>
    <rect class="gi-modul" x="36" y="414" width="128" height="36" rx="3"/>
    <text class="gi-schrift gi-fett gi-klein gi-mitte" x="100" y="353">Unterverteilung 1</text>
    <text class="gi-schrift gi-fett gi-klein gi-mitte" x="100" y="437">Unterverteilung n</text>
    <circle class="gi-knoten" cx="100" cy="392" r="2.5"/>
    <circle class="gi-knoten" cx="100" cy="399" r="2.5"/>
    <circle class="gi-knoten" cx="100" cy="406" r="2.5"/>
    <!-- Stromkreise -->
    <path class="gi-leitung" d="M164 326H264M164 348H264M164 370H300V510H290"/>
    <text class="gi-schrift gi-klein" x="172" y="320">Steckdosen</text>
    <text class="gi-schrift gi-klein" x="172" y="342">Kraft</text>
    <text class="gi-schrift gi-klein" x="172" y="364">Licht</text>
    <circle class="gi-punkt" cx="264" cy="326" r="3.5"/>
    <circle class="gi-punkt" cx="264" cy="348" r="3.5"/>
    <circle class="gi-punkt" cx="290" cy="510" r="3.5"/>
    <!-- Gebäudeautomation -->
    <path class="gi-knx" d="M100 450V490M100 470H233V484"/>
    <circle class="gi-knoten" cx="100" cy="470" r="3.5"/>
    <text class="gi-schrift gi-klein" x="112" y="464">Gebäudeautomation (KNX)</text>
    <rect class="gi-kasten" x="36" y="490" width="128" height="40" rx="3"/>
    <rect class="gi-kasten" x="176" y="484" width="114" height="52" rx="3"/>
    <text class="gi-schrift gi-fett gi-klein gi-mitte" x="100" y="515">Jalousien</text>
    <text class="gi-schrift gi-fett gi-klein gi-mitte" x="233" y="506">Beleuchtung</text>
    <text class="gi-schrift gi-klein gi-mitte" x="233" y="525">innen · außen</text>
    <!-- Daten und Kommunikation -->
    <rect class="gi-zone" x="24" y="560" width="288" height="120" rx="6"/>
    <text class="gi-schrift gi-fett gi-klein" x="40" y="582">Daten und Kommunikation</text>
    <rect class="gi-kasten" x="40" y="594" width="120" height="32" rx="3"/>
    <rect class="gi-kasten" x="176" y="594" width="120" height="32" rx="3"/>
    <rect class="gi-kasten" x="40" y="636" width="120" height="32" rx="3"/>
    <rect class="gi-kasten" x="176" y="636" width="120" height="32" rx="3"/>
    <text class="gi-schrift gi-klein gi-mitte" x="100" y="615">Netzwerk</text>
    <text class="gi-schrift gi-klein gi-mitte" x="236" y="615">Telefon</text>
    <text class="gi-schrift gi-klein gi-mitte" x="100" y="657">TV/SAT</text>
    <text class="gi-schrift gi-klein gi-mitte" x="236" y="657">Türsprechanlage</text>
  </svg>
</svg>
